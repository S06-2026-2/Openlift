# Configuração do gitleaks (OPS-02 / RNF-01). Usa todas as regras padrão e
# só libera o que é comprovadamente falso positivo. Antes de adicionar algo
# aqui, leia "Segurança: segredos no repositório" no README.md: liberar um
# segredo real é pior do que não ter o scanner.

title = "OpenLift"

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conhecidos do OpenLift"

# Modelo de variáveis de ambiente: só valores de exemplo ("change-me").
paths = [
  '''^api/\.env\.example$''',
  # Eventos NOSTR de exemplo do mini-NIP (ADR-0003): só dado público (pubkey,
  # id, sig), assinados com chave descartável que nunca foi salva. A regra
  # generic-api-key confunde o campo "pubkey" da NIP-01 com segredo.
  '''^docs/nips/examples/[^/]+\.json$''',
]

regexes = [
  # Credenciais de desenvolvimento local do docker compose (Postgres
  # openlift/openlift), que só existem na máquina de quem roda o projeto.
  '''openlift:openlift@''',
  '''POSTGRES_PASSWORD:\s*openlift''',
  # Exemplo de JWT truncado nos schemas do Swagger (api/app/domain/schemas/auth.py):
  # é só o cabeçalho {"alg":"HS256"...} em base64, seguido de "...".
  '''eyJhbGciOiJIUzI1NiIs\.\.\.''',
  # Chaves PÚBLICAS NOSTR (pubkey x-only, em hex) usadas como exemplo e em
  # testes: o vetor oficial da NIP-19 e a pubkey dos exemplos do mini-NIP
  # (docs/nips/examples/). Chave pública não é segredo; a regra
  # generic-api-key só dispara porque a variável se chama "PUBKEY".
  '''3bf0c63fcb93463407af97a5e5ee64fa883d107ef9e558472c4eb9aaaefa459d''',
  '''3361fd648012d81dfb176fd52b6c0f6dd9c5979b3bf40beaa30a9dae199a7f6a''',
]
