<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{ margin:0; }
  .navbar{
    width:390px; height:84px; background:#F5F4F1; border-top:2px solid #1a1a1a;
    display:flex; align-items:center; justify-content:space-around; padding:0 6px;
    font-family:'Patrick Hand','Segoe Print',sans-serif; box-sizing:border-box;
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; color:#9a9a95; width:56px; }
  .nav-item.active{ color:#1a1a1a; font-weight:700; }
  .nav-item span{ font-size:12px; }
  .nav-add{
    width:48px; height:48px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; margin-top:-30px; border:2px solid #1a1a1a;
  }
</style>
</helmet>
<div class="navbar">
  <div class="nav-item {{classes.dash}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="4" height="8"></rect><rect x="10" y="7" width="4" height="13"></rect><rect x="16" y="3" width="4" height="17"></rect></svg>
    <span>Dashboard</span>
  </div>
  <div class="nav-item {{classes.workouts}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8v8M18 8v8M2 10v4M22 10v4M6 12h12"></path></svg>
    <span>Treinos</span>
  </div>
  <div class="nav-add" style="background:{{accent}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </div>
  <div class="nav-item {{classes.feed}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    <span>Feed</span>
  </div>
  <div class="nav-item {{classes.profile}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
    <span>Perfil</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":"enum","default":"dashboard","options":["dashboard","workouts","feed","profile"]},"accent":{"editor":"color","default":"#FF6B00","options":["#FF6B00","#0284C7","#16A34A","#1a1a1a"]}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    return {
      accent: this.props.accent ?? '#FF6B00',
      classes: {
        dash: active === 'dashboard' ? 'active' : '',
        workouts: active === 'workouts' ? 'active' : '',
        feed: active === 'feed' ? 'active' : '',
        profile: active === 'profile' ? 'active' : '',
      },
    };
  }
}
</script>
</body>
</html>
