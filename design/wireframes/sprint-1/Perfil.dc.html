<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{ margin:0; }
  .frame{
    width:390px; height:844px; background:#F5F4F1; box-sizing:border-box;
    font-family:'Patrick Hand','Segoe Print',sans-serif; color:#1a1a1a;
    display:flex; flex-direction:column;
  }
  .topbar{ padding:18px 20px 14px; border-bottom:2px solid #1a1a1a; font-size:20px; }
  .content{ flex:1; overflow:hidden; padding:22px 20px 0; }

  .head{ display:flex; flex-direction:column; align-items:center; margin-bottom:20px; }
  .avatar-lg{
    width:76px; height:76px; border-radius:50%; border:2px solid #1a1a1a; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:10px;
  }
  .name{ font-size:20px; }
  .npub-row{ display:flex; align-items:center; gap:6px; margin-top:2px; }
  .npub{ font-family:'Courier New',monospace; font-size:12px; color:#7a7a75; }
  .copy{ font-size:11px; text-decoration:underline; text-decoration-style:dashed; color:#7a7a75; }

  .stats{ display:flex; gap:10px; margin-bottom:22px; }
  .stat{ flex:1; border:2px solid #1a1a1a; border-radius:8px; background:#fff; padding:10px; text-align:center; }
  .stat .value{ font-family:'Courier New',monospace; font-size:18px; font-weight:700; }
  .stat .label{ font-size:10px; color:#7a7a75; margin-top:2px; }
  .stat .tag{ font-size:9px; color:#b7743a; }

  .section-title{ font-size:14px; color:#7a7a75; margin-bottom:8px; }
  .list{ border:2px solid #1a1a1a; border-radius:8px; background:#fff; overflow:hidden; margin-bottom:16px; }
  .row{
    display:flex; align-items:center; gap:12px; padding:13px 14px;
    border-bottom:1px solid #ece9df; font-size:15px;
  }
  .row:last-child{ border-bottom:none; }
  .row .chev{ margin-left:auto; }
  .exit{ color:#b04a3a; }
</style>
</helmet>
<div class="frame">
  <div class="topbar">Perfil</div>
  <div class="content">
    <div class="head">
      <div class="avatar-lg">L</div>
      <div class="name">Luiz Otávio</div>
      <div class="npub-row">
        <div class="npub">npub1x3f…9kd2</div>
        <div class="copy">copiar</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="value">42</div>
        <div class="label">Treinos</div>
      </div>
      <div class="stat">
        <div class="value">12</div>
        <div class="label">Seguidores</div>
        <div class="tag">Fase 2</div>
      </div>
      <div class="stat">
        <div class="value">128</div>
        <div class="label">Curtidas</div>
        <div class="tag">Fase 2</div>
      </div>
    </div>

    <div class="section-title">Configurações</div>
    <div class="list">
      <div class="row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a5a55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        Editar perfil
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b7b7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <div class="row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a5a55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8M12 8v8"></path></svg>
        Relays NOSTR
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b7b7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <div class="row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a5a55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        Notificações
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b7b7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <div class="list">
      <div class="row exit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b04a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
        Sair
      </div>
    </div>
  </div>
  <dc-import name="BottomNav" active="profile" accent="{{accent}}" hint-size="390,84"></dc-import>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B00","options":["#FF6B00","#0284C7","#16A34A","#1a1a1a"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF6B00' };
  }
}
</script>
</body>
</html>
