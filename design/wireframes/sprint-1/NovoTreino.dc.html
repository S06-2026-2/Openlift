<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{ margin:0; }
  .frame{
    width:390px; height:844px; background:#F5F4F1; box-sizing:border-box;
    font-family:'Patrick Hand','Segoe Print',sans-serif; color:#1a1a1a;
    display:flex; flex-direction:column;
  }
  .topbar{
    padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid #1a1a1a;
  }
  .topbar-left{ display:flex; align-items:center; gap:12px; font-size:18px; }
  .save{ font-size:15px; font-weight:700; }
  .content{ flex:1; overflow:hidden; padding:18px 20px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; color:#7a7a75; margin-bottom:6px; }
  .field .box{
    height:44px; border:2px solid #1a1a1a; border-radius:6px; background:#fff;
    display:flex; align-items:center; padding:0 14px; font-size:15px;
  }

  .section-title{ font-size:16px; margin-bottom:10px; }

  .set-row{
    border:2px solid #1a1a1a; border-radius:8px; background:#fff; padding:12px;
    margin-bottom:10px;
  }
  .set-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .exercise{ font-size:16px; display:flex; align-items:center; gap:6px; }
  .set-fields{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .mini{ text-align:center; }
  .mini .mini-label{ font-size:10px; color:#9a9a95; }
  .mini .mini-box{
    border:2px solid #d8d6cf; border-radius:6px; height:34px; display:flex;
    align-items:center; justify-content:center; font-family:'Courier New',monospace; font-size:14px;
  }

  .add-set{
    border:2px dashed #9a9a95; border-radius:8px; height:44px; display:flex;
    align-items:center; justify-content:center; gap:8px; color:#5a5a55; font-size:15px;
    margin-bottom:8px;
  }

  .footer{ padding:16px 20px 28px; }
  .btn-primary{
    height:52px; border:2px solid #1a1a1a; border-radius:6px; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <div class="topbar-left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Novo Treino
    </div>
    <div class="save" style="color:{{accent}}">Salvar</div>
  </div>
  <div class="content">
    <div class="field">
      <label>Data</label>
      <div class="box">14/09/2026</div>
    </div>

    <div class="section-title">Séries</div>

    <div class="set-row">
      <div class="set-top">
        <div class="exercise">Supino reto <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7a7a75" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b7743a" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
      </div>
      <div class="set-fields">
        <div class="mini"><div class="mini-label">reps</div><div class="mini-box">8</div></div>
        <div class="mini"><div class="mini-label">carga (kg)</div><div class="mini-box">60</div></div>
        <div class="mini"><div class="mini-label">RPE</div><div class="mini-box">8</div></div>
      </div>
    </div>

    <div class="set-row">
      <div class="set-top">
        <div class="exercise">Agachamento livre <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7a7a75" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b7743a" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
      </div>
      <div class="set-fields">
        <div class="mini"><div class="mini-label">reps</div><div class="mini-box">5</div></div>
        <div class="mini"><div class="mini-label">carga (kg)</div><div class="mini-box">100</div></div>
        <div class="mini"><div class="mini-label">RPE</div><div class="mini-box">9</div></div>
      </div>
    </div>

    <div class="add-set">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5a5a55" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Adicionar série
    </div>
  </div>
  <div class="footer">
    <div class="btn-primary" style="background:{{accent}}">Salvar treino</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B00","options":["#FF6B00","#0284C7","#16A34A","#1a1a1a"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF6B00' };
  }
}
</script>
</body>
</html>
