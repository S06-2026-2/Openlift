<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{ margin:0; }
  .frame{
    width:390px; height:844px; background:#F5F4F1; box-sizing:border-box;
    font-family:'Patrick Hand','Segoe Print',sans-serif; color:#1a1a1a;
    display:flex; flex-direction:column;
  }
  .topbar{
    padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid #1a1a1a;
  }
  .wordmark{ font-size:20px; }
  .avatar{
    width:34px; height:34px; border-radius:50%; border:2px solid #1a1a1a; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .content{ flex:1; overflow:hidden; padding:18px 20px 0; }
  .greeting{ font-size:20px; margin-bottom:2px; }
  .subgreeting{ font-size:13px; color:#7a7a75; margin-bottom:18px; }

  .stats{ display:flex; gap:10px; margin-bottom:22px; }
  .stat{
    flex:1; border:2px solid #1a1a1a; border-radius:8px; background:#fff; padding:10px;
  }
  .stat .label{ font-size:11px; color:#7a7a75; margin-bottom:6px; }
  .stat .value{ font-family:'Courier New',monospace; font-size:20px; font-weight:700; }
  .stat .unit{ font-size:11px; color:#7a7a75; }

  .section-title{ font-size:16px; margin-bottom:2px; }
  .section-sub{ font-size:11px; color:#b7743a; margin-bottom:10px; }

  .chart{
    border:2px solid #1a1a1a; border-radius:8px; background:#fff; padding:14px;
    display:flex; align-items:flex-end; gap:8px; height:110px; margin-bottom:20px;
  }
  .bar{ flex:1; background:#d8d6cf; border-radius:3px 3px 0 0; }
  .bar-labels{ display:flex; gap:8px; margin-top:-16px; margin-bottom:20px; }
  .bar-labels span{ flex:1; text-align:center; font-size:11px; color:#9a9a95; }

  .heat{
    border:2px solid #1a1a1a; border-radius:8px; background:#fff; padding:12px; margin-bottom:8px;
  }
  .heat-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .heat-grid div{ aspect-ratio:1; border-radius:2px; }
  .heat-legend{ display:flex; align-items:center; gap:6px; font-size:10px; color:#9a9a95; margin-top:8px; }
  .heat-legend .sw{ width:10px; height:10px; border-radius:2px; }
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <div class="wordmark">OpenLift</div>
    <div class="avatar">L</div>
  </div>
  <div class="content">
    <div class="greeting">Olá, Luiz</div>
    <div class="subgreeting">3 treinos essa semana — continue assim.</div>

    <div class="stats">
      <div class="stat">
        <div class="label">Volume da semana</div>
        <div class="value">4.320</div>
        <div class="unit">kg</div>
      </div>
      <div class="stat">
        <div class="label">Treinos no mês</div>
        <div class="value">9</div>
        <div class="unit">sessões</div>
      </div>
      <div class="stat">
        <div class="label">Streak</div>
        <div class="value">5</div>
        <div class="unit">dias</div>
      </div>
    </div>

    <div class="section-title">Volume por semana</div>
    <div class="section-sub">gráfico de barras — dados reais no Sprint 3</div>
    <div class="chart">
      <div class="bar" style="height:35%"></div>
      <div class="bar" style="height:55%"></div>
      <div class="bar" style="height:40%"></div>
      <div class="bar" style="height:70%"></div>
      <div class="bar" style="height:50%"></div>
      <div class="bar" style="height:85%; background:{{accent}}"></div>
      <div class="bar" style="height:20%"></div>
    </div>
    <div class="bar-labels">
      <span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span>
    </div>

    <div class="section-title">Mapa de calor — grupo muscular</div>
    <div class="section-sub">Sprint 5 — volume por grupo x semana</div>
    <div class="heat">
      <div class="heat-grid">
        <div style="background:#f1ede4"></div><div style="background:#e6dcc6"></div><div style="background:#d9c299"></div><div style="background:#c99f5e"></div><div style="background:#f1ede4"></div><div style="background:#e6dcc6"></div><div style="background:#d9c299"></div>
        <div style="background:#e6dcc6"></div><div style="background:#c99f5e"></div><div style="background:#b7743a"></div><div style="background:#f1ede4"></div><div style="background:#d9c299"></div><div style="background:#c99f5e"></div><div style="background:#e6dcc6"></div>
        <div style="background:#f1ede4"></div><div style="background:#d9c299"></div><div style="background:#b7743a"></div><div style="background:#c99f5e"></div><div style="background:#e6dcc6"></div><div style="background:#f1ede4"></div><div style="background:#d9c299"></div>
        <div style="background:#e6dcc6"></div><div style="background:#f1ede4"></div><div style="background:#c99f5e"></div><div style="background:#d9c299"></div><div style="background:#b7743a"></div><div style="background:#e6dcc6"></div><div style="background:#f1ede4"></div>
      </div>
      <div class="heat-legend">
        <span>menos</span><div class="sw" style="background:#f1ede4"></div><div class="sw" style="background:#d9c299"></div><div class="sw" style="background:#b7743a"></div><span>mais volume</span>
      </div>
    </div>
  </div>
  <dc-import name="BottomNav" active="dashboard" accent="{{accent}}" hint-size="390,84"></dc-import>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B00","options":["#FF6B00","#0284C7","#16A34A","#1a1a1a"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF6B00' };
  }
}
</script>
</body>
</html>
