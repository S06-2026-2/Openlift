name: CI Report Agent

on:
  push:
    branches:
      - workflow/agent-skill

  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: AI CI Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CI Reporter
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are the CI reporting agent for the OpenLift project.

            Read the repository instructions located at:
            .github/agents/ci-reporter.agent.md

            Also read and follow the CI reporting skill located at:
            .github/skills/ci-report/SKILL.md

            For this initial test, verify that you can access these files.

            Do not modify any source code.

            Respond with a short summary explaining:
            - whether the agent instructions were found
            - whether the CI report skill was found
            - what the purpose of this agent is