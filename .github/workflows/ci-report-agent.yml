name: CI Report Agent

on:
  push:
    branches:
      - workflow/agent-skill

  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: AI CI Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CI Reporter
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are the CI reporting agent for the OpenLift project.

            Read and follow the agent instructions located at:
            .github/agents/ci-reporter.agent.md

            Read and follow the CI reporting skill located at:
            .github/skills/ci-report/SKILL.md

            Generate the OpenLift CI report.

            For this execution, CI test results have not yet been provided.
            You must clearly identify unavailable information instead of
            inventing results.

            Write the final report to:

            CI_REPORT.md

            Do not modify any application source code.

      - name: Verify generated report
        run: |
          if [ ! -f CI_REPORT.md ]; then
            echo "CI_REPORT.md was not generated."
            exit 1
          fi

          echo "CI_REPORT.md generated successfully."

      - name: Publish report to job summary
        run: cat CI_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: openlift-ci-report
          path: CI_REPORT.md