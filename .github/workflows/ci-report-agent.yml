
name: CI Report Agent

on:
  workflow_run:
    workflows:
      - Backend CI
      - Frontend CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  collect:
    name: Collect and Analyze CI Results
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout trusted code from the default branch
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ---------------------------------------------------------
      # Find completed CI runs for the same commit
      # ---------------------------------------------------------

      - name: Find Backend and Frontend runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for CI runs for commit: $HEAD_SHA"
          echo "Repository: $GH_REPO"

          BACKEND_RUN=$(gh run list \
            --repo "$GH_REPO" \
            --workflow backend-ci.yml \
            --commit "$HEAD_SHA" \
            --limit 100 \
            --json databaseId,status,conclusion \
            --jq '[.[] | select(.status == "completed")][0].databaseId // empty')

          FRONTEND_RUN=$(gh run list \
            --repo "$GH_REPO" \
            --workflow frontend-ci.yml \
            --commit "$HEAD_SHA" \
            --limit 100 \
            --json databaseId,status,conclusion \
            --jq '[.[] | select(.status == "completed")][0].databaseId // empty')

          BACKEND_CONCLUSION=$(gh run list \
            --repo "$GH_REPO" \
            --workflow backend-ci.yml \
            --commit "$HEAD_SHA" \
            --limit 100 \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed")][0].conclusion // empty')

          FRONTEND_CONCLUSION=$(gh run list \
            --repo "$GH_REPO" \
            --workflow frontend-ci.yml \
            --commit "$HEAD_SHA" \
            --limit 100 \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed")][0].conclusion // empty')

          echo "Backend Run: $BACKEND_RUN"
          echo "Backend Conclusion: $BACKEND_CONCLUSION"
          echo "Frontend Run: $FRONTEND_RUN"
          echo "Frontend Conclusion: $FRONTEND_CONCLUSION"

          {
            echo "backend_run=$BACKEND_RUN"
            echo "frontend_run=$FRONTEND_RUN"
            echo "backend_conclusion=$BACKEND_CONCLUSION"
            echo "frontend_conclusion=$FRONTEND_CONCLUSION"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$BACKEND_RUN" && -n "$FRONTEND_RUN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Both CI workflows completed."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for both CI workflows."
          fi

      # ---------------------------------------------------------
      # Stop if both CI results are not available
      # ---------------------------------------------------------

      - name: CI results not ready
        if: steps.runs.outputs.ready != 'true'
        run: |
          echo "Backend and Frontend CI are not both completed."
          echo "The next workflow_run event may trigger another check."

      # ---------------------------------------------------------
      # Prepare directories
      # ---------------------------------------------------------

      - name: Create input directories
        if: steps.runs.outputs.ready == 'true'
        run: |
          mkdir -p ci-input/backend
          mkdir -p ci-input/frontend

      # ---------------------------------------------------------
      # Download Backend CI artifacts
      # ---------------------------------------------------------

      - name: Download Backend artifacts
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BACKEND_RUN: ${{ steps.runs.outputs.backend_run }}
        run: |
          gh run download "$BACKEND_RUN" \
            --repo "$GH_REPO" \
            --dir ci-input/backend

      # ---------------------------------------------------------
      # Download Frontend CI artifacts
      # ---------------------------------------------------------

      - name: Download Frontend artifacts
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FRONTEND_RUN: ${{ steps.runs.outputs.frontend_run }}
        run: |
          gh run download "$FRONTEND_RUN" \
            --repo "$GH_REPO" \
            --dir ci-input/frontend

      # ---------------------------------------------------------
      # Display collected artifacts
      # ---------------------------------------------------------

      - name: Show collected CI artifacts
        if: steps.runs.outputs.ready == 'true'
        run: |
          echo "========================================"
          echo "BACKEND ARTIFACTS"
          echo "========================================"
          find ci-input/backend -type f -print

          echo ""
          echo "========================================"
          echo "FRONTEND ARTIFACTS"
          echo "========================================"
          find ci-input/frontend -type f -print

      # ---------------------------------------------------------
      # Verify expected artifacts
      # ---------------------------------------------------------

      - name: Verify Backend artifacts
        if: steps.runs.outputs.ready == 'true'
        run: |
          test -d ci-input/backend/backend-lint-results
          test -d ci-input/backend/backend-test-results
          echo "Backend artifacts verified."

      - name: Verify Frontend artifacts
        if: steps.runs.outputs.ready == 'true'
        run: |
          test -d ci-input/frontend/frontend-analysis-results
          test -d ci-input/frontend/frontend-test-results
          echo "Frontend artifacts verified."

      # ---------------------------------------------------------
      # Create CI metadata
      # ---------------------------------------------------------

      - name: Create CI metadata
        if: steps.runs.outputs.ready == 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BACKEND_RUN: ${{ steps.runs.outputs.backend_run }}
          FRONTEND_RUN: ${{ steps.runs.outputs.frontend_run }}
          BACKEND_CONCLUSION: ${{ steps.runs.outputs.backend_conclusion }}
          FRONTEND_CONCLUSION: ${{ steps.runs.outputs.frontend_conclusion }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          fields = [
              "HEAD_SHA",
              "HEAD_BRANCH",
              "BACKEND_RUN",
              "BACKEND_CONCLUSION",
              "FRONTEND_RUN",
              "FRONTEND_CONCLUSION",
          ]

          content = "OpenLift CI Results\n"

          for name in fields:
              content += f"{name}: {os.environ[name]}\n"

          Path("ci-input/metadata.txt").write_text(
              content,
              encoding="utf-8",
          )
          PY

      # ---------------------------------------------------------
      # Upload collected CI results
      # ---------------------------------------------------------

      - name: Upload collected CI results
        if: steps.runs.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collected-ci-results
          path: ci-input/
          if-no-files-found: error

      # ---------------------------------------------------------
      # Run Gemini CI Reporter Agent
      # ---------------------------------------------------------

      - name: Generate Gemini CI report
        id: agent
        if: steps.runs.outputs.ready == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ci_report_agent.py

      # ---------------------------------------------------------
      # Publish report to GitHub Actions summary
      # ---------------------------------------------------------

      - name: Publish report to job summary
        if: steps.runs.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -f CI_REPORT.md ]]; then
            cat CI_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CI Report Agent" >> "$GITHUB_STEP_SUMMARY"
            echo "Gemini report unavailable. Check the agent step." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------------------------------------------------------
      # Upload generated Gemini report
      # ---------------------------------------------------------

      - name: Upload Gemini CI report
        if: steps.runs.outputs.ready == 'true' && steps.agent.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gemini-ci-report
          path: CI_REPORT.md
          if-no-files-found: error
      

      - name: Publish Gemini report on PR
        if: steps.runs.outputs.ready == 'true' && steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh api \
            "repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open PR found for commit $HEAD_SHA."
            exit 0
          fi

          echo "Publishing report to PR #$PR_NUMBER"

          python - <<'PY'
          from pathlib import Path

          report = Path("CI_REPORT.md").read_text(
              encoding="utf-8"
          )

          marker = "<!-- openlift-ci-reporter -->"

          content = (
              marker
              + "\n"
              + report
          )

          Path("pr-comment.md").write_text(
              content[:60000],
              encoding="utf-8"
          )
          PY

          gh pr comment "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --body-file pr-comment.md \
            --edit-last --create-if-none

