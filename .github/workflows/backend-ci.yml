name: Backend CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy
        run: mypy .

      - name: Save lint results
        if: always()
        run: |
          mkdir -p reports
          echo "Backend static analysis executed." > reports/lint-result.txt
          echo "Tools: Ruff, Black and MyPy" >> reports/lint-result.txt

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-results
          path: api/reports/lint-result.txt
          if-no-files-found: warn

  test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests
        run: >
          pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --junitxml=reports/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            api/reports/junit.xml
            api/reports/coverage.xml
          if-no-files-found: warn