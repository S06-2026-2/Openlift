
name: Test Gemini API

on:
  workflow_dispatch:
  push:
    branches:
      - feat/gemini-agent
    paths:
      - ".github/workflows/test-gemini.yml"

permissions:
  contents: read

jobs:
  test-gemini:
    name: List Available Gemini Models
    runs-on: ubuntu-latest

    steps:
      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY")

          if not key:
              raise SystemExit(
                  "Erro: GEMINI_API_KEY não configurada."
              )

          base_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models"
          )

          page_token = None
          available_models = []

          try:
              while True:
                  params = {"pageSize": 100}

                  if page_token:
                      params["pageToken"] = page_token

                  url = (
                      base_url + "?" +
                      urllib.parse.urlencode(params)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-goog-api-key": key,
                          "Accept": "application/json",
                      },
                  )

                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      data = json.load(response)

                  for model in data.get("models", []):
                      methods = model.get(
                          "supportedGenerationMethods", []
                      )

                      if "generateContent" in methods:
                          available_models.append(
                              model["name"]
                          )

                  page_token = data.get("nextPageToken")

                  if not page_token:
                      break

          except urllib.error.HTTPError as error:
              print(f"Erro HTTP: {error.code}")
              print(
                  error.read().decode(
                      "utf-8", errors="replace"
                  )
              )
              raise SystemExit(1)

          except urllib.error.URLError as error:
              raise SystemExit(
                  f"Erro de conexão: {error.reason}"
              )

          print("\n=== MODELOS DISPONÍVEIS ===\n")

          if not available_models:
              raise SystemExit(
                  "Nenhum modelo com generateContent encontrado."
              )

          for model in sorted(available_models):
              print(model)

          print(
              f"\nTotal: {len(available_models)} modelos"
          )

          print("\n=== MODELOS FLASH ===\n")

          flash_models = [
              model
              for model in available_models
              if "flash" in model.lower()
          ]

          for model in sorted(flash_models):
              print(model)

          if not flash_models:
              print("Nenhum modelo Flash encontrado.")
          PY
