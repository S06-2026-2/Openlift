
name: Frontend CD

on:
  push:
    branches:
      - main
      - ops/abEnvironment
    paths:
      - "app/**"
      - "infra/docker/Dockerfile.web"
      - "infra/docker/nginx.conf.template"
      - ".github/workflows/frontend-cd.yml"

  workflow_dispatch:
    inputs:
          environment:
            description: "Ambiente de deploy"
            required: true
            type: choice
            default: staging
            options:
              - staging
              - production


permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Publish Flutter Web (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: 
        variant: [a, b]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          build-args: |
            APP_VARIANT=${{ matrix.variant }}
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ matrix.variant }}-${{ github.sha }}
            ghcr.io/${{ github.repository }}-web:${{ matrix.variant }}-${{ inputs.environment || 'staging' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.variant }}
    
    
  deploy:
    name: Deploy Flutter Web to Railway
    needs: build
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Verify Railway access
        env:
          RAILWAY_TOKEN: ${{ inputs.environment == 'production' && secrets.RAILWAY_TOKEN || secrets.RAILWAY_STAGING_TOKEN }}
        run: railway status

      - name: Redeploy Web Service
        env:
          RAILWAY_TOKEN: ${{ inputs.environment == 'production' && secrets.RAILWAY_TOKEN || secrets.RAILWAY_STAGING_TOKEN }}
        run: |
          railway redeploy --service openlift-web --yes

