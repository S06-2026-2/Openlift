name: Commitlint

# OPS-02: valida que todo commit do PR segue Conventional Commits
# (feat:, fix:, docs:, style:, refactor:, test:, chore:, ...). Regras em
# commitlint.config.js.

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install --no-save --no-package-lock @commitlint/cli@19.5.0 @commitlint/config-conventional@19.5.0

      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
