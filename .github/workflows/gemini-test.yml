name: Gemini Connection Test

'on':
  push:
    branches:
      - feat/copilot-reporter

  workflow_dispatch: {}

jobs:
  test-gemini:
    name: Test Gemini API
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test Gemini Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing."
            exit 1
          fi

          curl --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Reply only: OpenLift connection successful."
                }]
              }],
              "generationConfig": {
                "maxOutputTokens": 100
              }
            }'