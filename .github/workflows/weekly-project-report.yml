name: Weekly Project Report

on:
  push:
    branches:
    - ops/weeklyReport

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  collect:
    name: Collect Weekly GitHub Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/weekly_report/collect.py

      - name: Upload collected data
        uses: actions/upload-artifact@v4
        with:
          name: weekly-project-data
          path: reports/weekly/weekly-data.json
          retention-days: 30
          if-no-files-found: error
