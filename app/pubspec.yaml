name: openlift
description: >
  OpenLift — registro de treinos, dashboards e compartilhamento social via NOSTR.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Estado e navegação (Sprint 1)
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  # Rede (Sprint 2)
  dio: ^5.4.0
  # Custódia local de chaves/sessão (Sprint 2)
  flutter_secure_storage: ^9.0.0
  # Gráficos e heatmap (Sprint 3/5)
  fl_chart: ^0.68.0
  # Protocolo NOSTR (ADR-0003, ADR-0005). Spike do FE-04: chave, assinatura e
  # NIP-19 com bip340 + crypto em Dart puro (rodam iguais na web e no APK),
  # sem dart_nostr/ndk.
  bip340: ^0.3.1
  crypto: ^3.0.7
  uuid: ^4.6.0
  unorm_dart: ^0.3.3
  # Cliente de relay NOSTR (FE-05): WebSocket puro, igual na web e no APK.
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0
  json_schema: ^5.2.2

flutter:
  uses-material-design: true
