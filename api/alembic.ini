[alembic]
script_location = alembic
# TODO(Sprint 1): sqlalchemy.url é setado dinamicamente em alembic/env.py a partir de DATABASE_URL,
# não hardcoded aqui — mantém segredos fora do arquivo versionado.

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
