[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations são geradas pelo `alembic revision --autogenerate` — não faz
# sentido reformatar código que a própria ferramenta reescreve.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
force-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false  # TODO: apertar para true a partir do Sprint 4

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
